name: Go Security & CI

on:
  push:
    branches: [main, master]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-security.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-security.yml'
  schedule:
    # Run security scan weekly on Sundays at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger

env:
  GO_VERSION: '1.26'
  # Opt into Node.js 24 for GitHub Actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write # Required for uploading SARIF results

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Build and Test
  # ════════════════════════════════════════════════════════════════════════════
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false
        continue-on-error: true

  # ════════════════════════════════════════════════════════════════════════════
  # Format, Tidy & Lint
  # ════════════════════════════════════════════════════════════════════════════
  fmt-lint:
    name: Format, Tidy & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::Unformatted files detected:"
            echo "$out"
            exit 1
          fi

      - name: Verify go mod tidy
        run: go mod tidy -diff

      - name: Verify go vet
        run: go vet ./...

  # ════════════════════════════════════════════════════════════════════════════
  # Security Tests
  # ════════════════════════════════════════════════════════════════════════════
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run security-focused tests
        run: |
          go test -race -count=1 -v \
            -run 'TestSecurity_|TestCommandInjection|TestPrivilegeEscalation|TestTUISpoofing|TestConfigurationHijacking|TestSecurityEdgeCases|TestSecurityFixes' \
            ./...

  # ════════════════════════════════════════════════════════════════════════════
  # Gosec - Go Security Checker
  # ════════════════════════════════════════════════════════════════════════════
  gosec:
    name: Gosec Security Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run Gosec Security Scanner (SARIF)
        run: gosec -no-fail -fmt sarif -out gosec-results.sarif ./...
        continue-on-error: true

      - name: Upload Gosec SARIF results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif
        if: always()

      - name: Run Gosec with console output
        run: gosec -fmt text ./...

  # ════════════════════════════════════════════════════════════════════════════
  # Static Analysis
  # ════════════════════════════════════════════════════════════════════════════
  staticcheck:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

  # ════════════════════════════════════════════════════════════════════════════
  # Vulnerability Check
  # ════════════════════════════════════════════════════════════════════════════
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck (fail on new reachable vulnerabilities)
        run: |
          set +e
          govulncheck -format text ./... | tee govulncheck.txt
          code=${PIPESTATUS[0]}
          set -e
          [ "$code" -eq 0 ] && exit 0
          [ "$code" -ne 3 ] && exit "$code"
          found=$(grep -oE 'GO-[0-9]{4}-[0-9]+' govulncheck.txt | sort -u)
          allow=$(grep -oE 'GO-[0-9]{4}-[0-9]+' security/govulncheck-allowlist.txt 2>/dev/null | sort -u)
          new=$(comm -23 <(printf '%s\n' "$found") <(printf '%s\n' "$allow") | grep -c . || true)
          if [ "${new:-0}" -gt 0 ]; then
            echo "::error::New reachable advisories (not in allowlist):"
            comm -23 <(printf '%s\n' "$found") <(printf '%s\n' "$allow")
            exit 1
          fi
          echo "All reachable advisories are triaged in security/govulncheck-allowlist.txt"

      - name: Upload govulncheck report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: govulncheck-report
          path: govulncheck.txt

  # ════════════════════════════════════════════════════════════════════════════
  # Dependency Review (for PRs)
  # ════════════════════════════════════════════════════════════════════════════
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  # ════════════════════════════════════════════════════════════════════════════
  # CodeQL Analysis
  # ════════════════════════════════════════════════════════════════════════════
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"

  # ════════════════════════════════════════════════════════════════════════════
  # License Check
  # ════════════════════════════════════════════════════════════════════════════
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Check licenses
        run: go-licenses check ./...

  # ════════════════════════════════════════════════════════════════════════════
  # CI Gate (Unified Required Check)
  # ════════════════════════════════════════════════════════════════════════════
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [build, fmt-lint, security-tests, gosec, staticcheck, govulncheck, codeql, dependency-review, license-check]
    steps:
      - name: Aggregate status
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "results: $results"
          case "$results" in
            *failure*|*cancelled*)
              echo "::error::One or more required CI jobs failed or were cancelled"
              exit 1
              ;;
            *)
              echo "All required CI jobs passed successfully"
              exit 0
              ;;
          esac
